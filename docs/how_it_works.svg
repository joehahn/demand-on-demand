<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1000 290" width="1000" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a forecast request flows">
  <title>How demand-on-demand works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6964"/>
    </marker>
  </defs>
  <rect y="40" width="1000" height="290" rx="12" fill="#ffffff"/>

  <!-- the person and their assistant -->
  <rect x="20" y="55" width="170" height="140" rx="10" fill="#fdf6d8" stroke="#d9c26a" stroke-width="1.5"/>
  <text x="105" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1e1c">You</text>
  <text x="105" y="122" text-anchor="middle" font-size="12.5" fill="#4a4844">enter a plain-English</text>
  <text x="105" y="141" text-anchor="middle" font-size="12.5" fill="#4a4844">request</text>

  <!-- the forecasting agent -->
  <rect x="240" y="55" width="220" height="140" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="350" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1e1c">Forecasting agent</text>
  <text x="350" y="107" text-anchor="middle" font-size="12.5" fill="#4a4844">AI looks up products and</text>
  <text x="350" y="124" text-anchor="middle" font-size="12.5" fill="#4a4844">places and writes SQL to</text>
  <text x="350" y="141" text-anchor="middle" font-size="12.5" fill="#4a4844">select the records needed</text>
  <text x="350" y="158" text-anchor="middle" font-size="12.5" fill="#4a4844">by the ML models</text>
  <text x="350" y="180" text-anchor="middle" font-size="11.5" fill="#6b6964">about 15 seconds</text>

  <!-- fixed code -->
  <rect x="530" y="55" width="220" height="140" rx="10" fill="#fdf6d8" stroke="#d9c26a" stroke-width="1.5"/>
  <text x="640" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1e1c">Fixed Python code</text>
  <text x="640" y="107" text-anchor="middle" font-size="12.5" fill="#4a4844">sums records by week or month,</text>
  <text x="640" y="124" text-anchor="middle" font-size="12.5" fill="#4a4844">trains and tunes ML models,</text>
  <text x="640" y="141" text-anchor="middle" font-size="12.5" fill="#4a4844">tests the models and</text>
  <text x="640" y="158" text-anchor="middle" font-size="12.5" fill="#4a4844">compares them to the baseline</text>
  <text x="640" y="180" text-anchor="middle" font-size="11.5" fill="#6b6964">about 10 seconds</text>

  <!-- dashboard -->
  <rect x="800" y="55" width="180" height="140" rx="10" fill="#fdf6d8" stroke="#d9c26a" stroke-width="1.5"/>
  <text x="890" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1e1c">Dashboard</text>
  <text x="890" y="104" text-anchor="middle" font-size="12.5" fill="#4a4844">visualizes the forecast,</text>
  <text x="890" y="120" text-anchor="middle" font-size="12.5" fill="#4a4844">test results and accuracy</text>
  <rect x="812" y="130" width="156" height="38" rx="7" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="890" y="145" text-anchor="middle" font-size="11.5" fill="#1f1e1c">AI writes a</text>
  <text x="890" y="160" text-anchor="middle" font-size="11.5" fill="#1f1e1c">one-sentence summary</text>
  <text x="890" y="182" text-anchor="middle" font-size="11.5" fill="#6b6964">about 2 seconds</text>

  <!-- warehouse -->
  <rect x="380" y="255" width="300" height="56" rx="10" fill="#e9f5e4" stroke="#6fae5c" stroke-width="1.5"/>
  <text x="530" y="279" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f1e1c">Postgres warehouse</text>
  <text x="530" y="298" text-anchor="middle" font-size="11.5" fill="#6b6964">26M sales records</text>

  <!-- request and data flow -->
  <g stroke="#6b6964" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="190" y1="125" x2="236" y2="125"/>
    <line x1="460" y1="125" x2="526" y2="125"/>
    <line x1="750" y1="125" x2="796" y2="125"/>
  </g>

  <!-- reads (read-only) -->
  <g stroke="#9a9892" stroke-width="1.3" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <line x1="350" y1="195" x2="455" y2="252"/>
    <line x1="640" y1="195" x2="590" y2="252"/>
  </g>
  <text x="408" y="236" text-anchor="end" font-size="10.5" fill="#6b6964">read only</text>
  <text x="620" y="236" font-size="10.5" fill="#6b6964">read only</text>

</svg>
